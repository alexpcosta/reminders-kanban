<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 992" width="1400" height="992" role="img" aria-labelledby="title desc" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">How Task Board works</title>
<desc id="desc">Task Board on a Mac reads and writes Apple Reminders through EventKit. Apple Reminders syncs with iCloud to iPhone, iPad and Apple Watch. Apple Watch, HomePod mini, iPhone and iPad send voice requests to Siri, and Siri creates reminders in the ToDo list. An optional button runs a Shortcut that can publish the lists to a display.</desc>
